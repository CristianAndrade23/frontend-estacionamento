name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest e build)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes unitários (Vitest)
        run: npx ng test --watch=false

      - name: Build de produção
        run: npx ng build

      - name: Build da demo (GitHub Pages)
        run: |
          npx ng build --configuration demo --output-path dist/pages --base-href "/${{ github.event.repository.name }}/"
          # Fallback de SPA: o GitHub Pages serve 404.html para rotas desconhecidas.
          cp dist/pages/browser/index.html dist/pages/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist/pages/browser

  backend:
    name: Backend (JUnit e MockMvc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Testes da API
        working-directory: backend
        run: ./mvnw -B verify

  e2e:
    name: E2E (Cypress contra o jar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache do binário do Cypress
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build do jar com o Angular e testes E2E
        run: npm run e2e

      - name: Screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy:
    name: Deploy da demo (GitHub Pages)
    if: github.event_name != 'pull_request'
    needs: [frontend, backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
