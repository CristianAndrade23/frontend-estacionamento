spring.application.name=estacionamento-api
server.port=${PORT:8080}

# Banco em memória: os dados de demonstração são recriados a cada inicialização.
spring.datasource.url=jdbc:h2:mem:estacionamento;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Segredo do JWT: em produção, defina a variável de ambiente APP_JWT_SECRET (mínimo de 32 caracteres).
app.jwt-secret=${APP_JWT_SECRET:segredo-de-desenvolvimento-troque-em-producao-123456}
app.jwt-expiracao=8h
app.fuso=America/Sao_Paulo
app.demo-reset=${APP_DEMO_RESET:true}

spring.jackson.time-zone=America/Sao_Paulo

management.endpoints.web.exposure.include=health

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
